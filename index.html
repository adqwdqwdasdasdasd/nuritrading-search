<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>단가표 검색</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* ...기존 스타일... */
    body {
      margin: 0;
      font-family: sans-serif;
    }
    .search-container {
      padding: 16px;
    }
    .search-box {
      display: flex;
      justify-content: center;
    }
    #searchInput {
      width: 100%;
      max-width: 500px;
      padding: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #tableWrapper {
      width: 100%;
      transition: opacity 0.3s ease;
      opacity: 0;
      height: 0;
      overflow: hidden;
    }
    #tableWrapper.active {
      opacity: 1;
      height: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="예: 가리비, 연어 등 검색" />
    </div>
  </div>

  <div id="tableWrapper">
    <table id="resultTable">
      <thead>
        <tr>
          <th>품목</th>
          <th>원산지</th>
          <th>중량</th>
          <th>규격</th>
          <th>단가</th>
          <th>창고</th>
          <th>브랜드</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="7">⏳ 불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 수정된 script.js를 불러오기 -->
  <script src="script.js"></script>
</body>
</html>
