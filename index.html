<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>단가표 검색</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 30px;
      background: #ffffff;
    }

    .search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      padding: 0 16px;
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 48px 14px 20px;
      font-size: 17px;
      border: 2px solid #ccc;
      border-radius: 999px;
      outline: none;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
    }

    .search-box input:focus {
      border-color: #999;
    }

    .search-box::after {
      content: "🔍";
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #666;
    }

    #tableWrapper {
      overflow: hidden;
      transition: max-height 0.3s ease-out, opacity 0.3s ease;
      max-height: 0;
      opacity: 0;
    }

    #tableWrapper.active {
      max-height: 1000px;
      opacity: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      font-size: 15px;
    }

    th {
      background-color: #f9f9f9;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .search-box input {
        font-size: 15px;
        padding: 12px 44px 12px 16px;
      }

      th, td {
        padding: 6px 4px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="예: 가리비, 연어 등 검색" />
    </div>
  </div>

  <div id="tableWrapper">
    <table id="resultTable">
      <thead>
        <tr>
          <th>품목</th><th>원산지</th><th>중량</th><th>규격</th><th>단가</th><th>창고</th><th>브랜드</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="7">⏳ 불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
