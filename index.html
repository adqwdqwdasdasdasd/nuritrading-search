
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nuritrading Search</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }
    .container {
      padding: 1rem;
    }
    .data-table {
      margin-top: 1rem;
      display: none;
    }
    .data-table.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <input id="search" placeholder="검색어를 입력하세요" style="width: 100%; padding: 8px;" />
    <div id="result" class="data-table">
      <table border="1" width="100%">
        <thead>
          <tr>
            <th>품목</th><th>원산지</th><th>중량</th><th>규격</th><th>단가</th><th>창고</th><th>브랜드</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const data = [
      { 품목: "가리비", 원산지: "국산", 중량: "1kg", 규격: "대", 단가: "10000", 창고: "부산", 브랜드: "누리" },
      { 품목: "새우", 원산지: "베트남", 중량: "500g", 규격: "중", 단가: "7000", 창고: "인천", 브랜드: "누리" }
    ];

    const searchInput = document.getElementById("search");
    const resultDiv = document.getElementById("result");
    const tableBody = document.getElementById("tableBody");

    function updateHeight() {
      const visible = resultDiv.classList.contains("show");
      const height = visible ? resultDiv.scrollHeight + 150 : 0;
      window.parent.postMessage({ type: "setHeight", height }, "*");
    }

    searchInput.addEventListener("input", () => {
      const keyword = searchInput.value.trim();
      tableBody.innerHTML = "";

      if (keyword) {
        const filtered = data.filter(item => {
          return Object.values(item).some(val => val.includes(keyword));
        });

        if (filtered.length > 0) {
          resultDiv.classList.add("show");
          filtered.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${row.품목}</td><td>${row.원산지}</td><td>${row.중량}</td><td>${row.규격}</td><td>${row.단가}</td><td>${row.창고}</td><td>${row.브랜드}</td>`;
            tableBody.appendChild(tr);
          });
        } else {
          resultDiv.classList.remove("show");
        }
      } else {
        resultDiv.classList.remove("show");
      }

      updateHeight();
    });
  </script>
</body>
</html>
